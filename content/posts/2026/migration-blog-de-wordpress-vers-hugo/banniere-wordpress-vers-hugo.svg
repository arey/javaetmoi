<svg viewBox="0 0 1260 240" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5F0E6"/>
    </linearGradient>
    <linearGradient id="termHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B222C"/>
      <stop offset="100%" stop-color="#232B37"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8B6A3F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- base : fond clair, cohérent avec le site -->
  <rect width="1260" height="240" fill="url(#bg)"/>

  <!-- rond café en filigrane, clin d'œil coffee/Java -->
  <circle cx="1170" cy="40" r="130" fill="none" stroke="#C99A6B" stroke-width="14" opacity="0.14"/>
  <circle cx="60" cy="230" r="90" fill="none" stroke="#21759B" stroke-width="10" opacity="0.08"/>

  <!-- headline -->
  <text x="56" y="52" fill="#1E2430" font-size="30" font-weight="700" letter-spacing="-0.3">
    WordPress <tspan fill="#C1633A">&#8594;</tspan> Hugo
  </text>
  <text x="56" y="76" fill="#6B7280" font-size="14.5" letter-spacing="0.2">
    14 ans de blog convertis en 2 semaines, avec GitHub Copilot
  </text>

  <!-- terminal card -->
  <g filter="url(#cardShadow)">
    <rect x="56" y="96" width="1148" height="126" rx="10" fill="#11151D"/>
    <rect x="56" y="96" width="1148" height="26" rx="10" fill="url(#termHead)"/>
    <rect x="56" y="112" width="1148" height="10" fill="url(#termHead)"/>
    <circle cx="76" cy="109" r="4.2" fill="#FF5F57"/>
    <circle cx="90" cy="109" r="4.2" fill="#FEBC2E"/>
    <circle cx="104" cy="109" r="4.2" fill="#28C840"/>
    <text x="630" y="113" text-anchor="middle" fill="#7D8590" font-size="10.5">javaetmoi.com — git diff</text>

    <g font-size="12.5">
      <text x="76" y="141" fill="#F47067">- platform: WordPress · MySQL · PHP</text>
      <text x="76" y="159" fill="#F47067">- hosting:  OVH mutualisé (payant)</text>
      <text x="640" y="141" fill="#7EE787">+ platform: Hugo · Go · Markdown</text>
      <text x="640" y="159" fill="#7EE787">+ hosting:  GitHub Pages (gratuit)</text>

      <line x1="76" y1="170" x2="1180" y2="170" stroke="#232B37" stroke-width="1"/>

      <text x="76" y="192" fill="#F47067">- build:    quelques secondes, DB requise</text>
      <text x="640" y="192" fill="#7EE787">+ build:    ~1s pour 623 pages</text>
      <text x="76" y="210" fill="#F47067">- since:    2012, 14 ans de service</text>
      <text x="640" y="210" fill="#7EE787">+ assisted: GitHub Copilot, 2 semaines</text>
    </g>
  </g>

  <!-- tasse à café, clin d'œil Java & Moi -->
  <g transform="translate(1188,34)" opacity="0.9">
    <path d="M0,8 h26 v14 a13,13 0 0 1 -13,13 h0 a13,13 0 0 1 -13,-13 z" fill="none" stroke="#C1633A" stroke-width="2.2"/>
    <path d="M26,12 h6 a5.5,5.5 0 0 1 0,11 h-6" fill="none" stroke="#C1633A" stroke-width="2.2"/>
    <path d="M5,3 C3.5,-1.5 8,-1.5 6.5,-6" fill="none" stroke="#C1633A" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
    <path d="M12,3 C10.5,-1.5 15,-1.5 13.5,-6" fill="none" stroke="#C1633A" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
  </g>
</svg>
